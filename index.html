<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Check current weather and forecast for any city</p>
        </header>


        <!-- Search Section -->
        <section class="search-section">

            <form id="searchForm">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="searchBtn">
                    Search
                </button>

            </form>

            <button id="locationBtn" class="location-btn">
                📍 Use My Location
            </button>

        </section>


        <!-- Loading -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading weather...</p>
        </div>


        <!-- Error -->
        <div id="errorMessage" class="error hidden"></div>


        <!-- Current Weather -->
        <section id="currentWeather" class="weather-card hidden">

            <div class="weather-header">

                <div>
                    <h2 id="cityName">City</h2>
                    <p id="countryName">Country</p>
                    <p id="weatherTime">--</p>
                </div>

                <div class="weather-icon" id="weatherIcon">
                    ☀️
                </div>

            </div>


            <div class="temperature-section">

                <div>
                    <span id="temperature">--</span>
                    <span id="temperatureUnit">°C</span>
                </div>

                <p id="weatherDescription">
                    --
                </p>

            </div>


            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail-card">
                    <span>💧</span>
                    <h3>Humidity</h3>
                    <p>
                        <span id="humidity">--</span>%
                    </p>
                </div>

                <div class="detail-card">
                    <span>💨</span>
                    <h3>Wind Speed</h3>
                    <p>
                        <span id="windSpeed">--</span>
                        km/h
                    </p>
                </div>

                <div class="detail-card">
                    <span>🌡️</span>
                    <h3>Feels Like</h3>
                    <p>
                        <span id="feelsLike">--</span>°C
                    </p>
                </div>

                <div class="detail-card">
                    <span>🌧️</span>
                    <h3>Precipitation</h3>
                    <p>
                        <span id="precipitation">--</span> mm
                    </p>
                </div>

            </div>


            <!-- Temperature Unit -->
            <div class="unit-section">

                <button id="celsiusBtn" class="unit-btn active">
                    °C
                </button>

                <button id="fahrenheitBtn" class="unit-btn">
                    °F
                </button>

            </div>

        </section>


        <!-- Forecast -->
        <section id="forecastSection" class="forecast-section hidden">

            <h2>5-Day Forecast</h2>

            <div id="forecastContainer" class="forecast-container">
                <!-- Forecast cards generated by JavaScript -->
            </div>

        </section>


        <!-- Recent Searches -->
        <section class="history-section">

            <div class="history-header">

                <h2>Recent Searches</h2>

                <button id="clearHistoryBtn">
                    Clear
                </button>

            </div>

            <div id="historyContainer" class="history-container">
                <!-- History generated by JavaScript -->
            </div>

        </section>


        <!-- Footer -->
        <footer>

            <p>
                Weather data provided by
                <a
                    href="https://open-meteo.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Open-Meteo
                </a>
            </p>

        </footer>

    </div>


    <script src="js/app.js"></script>

</body>
</html>
